<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Ball Constructor Demonstration</title>
    <style>
        body {
            margin: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <canvas id="myCanvas" width="600" height="400"></canvas>

    <script>
        var canvas = document.getElementById("myCanvas");
        var context = canvas.getContext("2d");

        function Ball(x, y, width, height, color, force, vx, vy) {
            this.x = x || 100;
            this.y = y || 100;
            this.width = width || 50;
            this.height = height || 50;
            this.color = color || "#ff0000";
            this.force = force || 1;
            this.vx = vx || 3;
            this.vy = vy || 2;
        }

        Ball.prototype.draw = function(context) {
            context.save();
            
            context.translate(this.x, this.y);
            
            context.beginPath();
            
            var radius = this.width / 2;
            var startAngle = 0;
            var endAngle = 360 * Math.PI / 180;
            
            context.arc(0, 0, radius, startAngle, endAngle, true);
            
            context.closePath();
            
            context.fillStyle = this.color;
            context.fill();
            
            context.restore();
        };

        Ball.prototype.move = function() {
            this.x += this.vx;
            this.y += this.vy;

            var radius = this.width / 2;
            if (this.x - radius < 0 || this.x + radius > canvas.width) {
                this.vx *= -1;
            }
            if (this.y - radius < 0 || this.y + radius > canvas.height) {
                this.vy *= -1; 
            }
        };

        var ball = new Ball(300, 200, 60, 60, "deepskyblue", 1, 4, 3);

        function animate() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            
            ball.move();
            ball.draw(context);
            
            requestAnimationFrame(animate);
        }

         animate();
    </script>

</body>
</html>
